name: Android legacy and modern APKs
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified phone and TV APK to Releases
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode private signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/libretv-release.p12"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Build, test and lint
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/libretv-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android --no-daemon testLegacyDebugUnitTest testModernDebugUnitTest lintLegacyRelease lintModernRelease assembleLegacyRelease assembleModernRelease
      - name: Verify and package
        run: |
          mkdir -p android-release
          cp android/app/build/outputs/apk/legacy/release/app-legacy-release.apk android-release/LibreTV-App-Android-v2.0.8-legacy-android5.apk
          cp android/app/build/outputs/apk/modern/release/app-modern-release.apk android-release/LibreTV-App-Android-v2.0.8-modern-android8.apk
          for apk in android-release/*.apk; do "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"; done
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-release/*legacy*.apk | grep "sdkVersion:'21'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-release/*modern*.apk | grep "sdkVersion:'26'"
          git archive --format=zip --output=android-release/LibreTV-App-Android-v2.0.8-Source.zip HEAD
          cp android/使用说明.txt android-release/LibreTV-App-Android-Guide.txt
          cd android-release && sha256sum *.apk *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android-release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: android/app/build/reports/
  device-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: legacy-phone
            api: 21
            profile: Nexus 5
            target: default
            arch: x86
            task: connectedLegacyDebugAndroidTest
          - device: legacy-tv
            api: 28
            profile: tv_1080p
            target: android-tv
            arch: x86
            task: connectedLegacyDebugAndroidTest
          - device: modern-phone
            api: 35
            profile: pixel_2
            target: google_apis
            arch: x86_64
            task: connectedModernDebugAndroidTest
          - device: modern-tv
            api: 28
            profile: tv_1080p
            target: android-tv
            arch: x86
            task: connectedModernDebugAndroidTest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 android/tools/receive_test_screenshots.py & receiver=$!; trap 'kill "$receiver" 2>/dev/null || true' EXIT; gradle -p android --no-daemon ${{ matrix.task }}; result=$?; python3 android/tools/check_test_screenshots.py; shots=$?; if [ $result -ne 0 ]; then exit $result; fi; exit $shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.device }}-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/screenshots/
  publish:
    if: inputs.publish
    needs: [build, device-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-release
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-v2.0.8 --target "$GITHUB_SHA" --draft --title '静观 TV Android 2.0.8 · 兼容版 / 新版' --notes-file android/RELEASE.md android-release/*
          gh release edit android-v2.0.8 --draft=false --latest
