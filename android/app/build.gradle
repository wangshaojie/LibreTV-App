plugins { id 'com.android.application' }

android {
    namespace 'com.wangshaojie.libretv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.wangshaojie.libretv'
        minSdk 21
        targetSdk 35
        versionCode 8
        versionName '2.0.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'androidVersion'
    productFlavors {
        legacy {
            dimension 'androidVersion'
            minSdk 21
            buildConfigField 'boolean', 'LEGACY_TLS', 'true'
            resValue 'string', 'app_name', 'LibreTV-App 兼容版'
        }
        modern {
            dimension 'androidVersion'
            minSdk 26
            buildConfigField 'boolean', 'LEGACY_TLS', 'false'
            resValue 'string', 'app_name', 'LibreTV-App 新版'
        }
    }
    signingConfigs {
        if (System.getenv('ANDROID_KEYSTORE_FILE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'libretv-app'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true; disable 'ObsoleteSdkInt', 'SetTextI18n', 'HardcodedText', 'ContentDescription', 'UnusedResources' }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
